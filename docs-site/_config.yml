title: Wardkeep
description: Private, self-hostable, AI-powered personal finance
url: "https://reyvera.github.io"
baseurl: "/budgetapp"

remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

color_scheme: dark

# logo: "/assets/images/logo.svg"  # Uncomment when logo is added

aux_links:
  "GitHub":
    - "https://github.com/reyvera/budgetapp"
  "Docker Hub":
    - "https://github.com/reyvera/budgetapp/pkgs/container/wardkeep-api"

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Copyright &copy; 2026 Reymundo A Vera. Licensed under <a href=\"https://github.com/reyvera/budgetapp/blob/main/LICENSE\">AGPL-3.0</a>."

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/

ga_tracking: # Add your Google Analytics ID here if desired

exclude:
  - node_modules/
  - vendor/
  - Gemfile.lock
  - README.md
